<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c4f86">
<title>Manejo de Cria</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fazenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<style>
:root{
  --cal:#f8f7f2; --papel:#ffffff; --tinta:#2a231b; --tinta2:#62584b; --linha:#d6cfbf;
  --anil:#2c4f86; --anil2:#1d3762; --ipe:#f2b705; --ipe-claro:#fff3c7; --ipe2:#b97f00;
  --pasto:#3f7d2c; --pasto-claro:#e4f0da; --terra:#a4421f; --terra-claro:#f6e2d8; --madeira:#6b4526;
  /* nomes antigos usados nas telas */
  --verde:var(--pasto); --verde2:var(--pasto-claro); --verm:#b3341c; --amar:var(--ipe2); --ok:var(--pasto); --mute:var(--tinta2); --line:var(--linha); --bg:var(--cal); --azul:var(--anil); --ink:var(--tinta); --card:var(--papel);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cal);color:var(--tinta);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;margin:0;letter-spacing:.2px;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ipe);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 130px}

/* ---- cena do topo (só na tela Fazenda) ---- */
.cena{position:relative;border-bottom:3px solid var(--tinta);overflow:hidden;background:#d5ecf8}
.cena svg.paisagem{display:block;width:100%;height:250px}
.cena .saud{position:absolute;left:16px;top:60px;right:16px;color:var(--tinta)}
.cena.noite .saud{color:#fff}
.cena .saud h1{font-size:28px;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.cena .saud p{margin:4px 0 0;font-size:16px;font-weight:700;opacity:.85}
.cena .clima{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);border:2px solid var(--tinta);border-radius:999px;padding:5px 12px;font-weight:700;font-size:16px;display:flex;gap:6px;align-items:center}
.cena .clima small{font-weight:400;font-size:13px}
.cena .sol{transform-origin:center;animation:nascer 1.6s ease-out both}
@keyframes nascer{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* ---- cabeçalho compacto (demais telas) ---- */
header.top{background:var(--anil);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:1000;border-bottom:4px solid var(--ipe)}
header.top .in{max-width:640px;margin:0 auto}
header.top h1{font-size:25px}
header.top small{opacity:.85;font-size:14px;display:block}

.banner{background:var(--ipe-claro);border:2px dashed var(--ipe2);color:#5a4100;border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px}

/* ---- cartões: papel com contorno de tinta e sombra seca ---- */
.card{background:var(--papel);border:2px solid var(--tinta);border-radius:16px;padding:16px;margin-bottom:18px;box-shadow:3px 3px 0 var(--tinta)}
.card h2{font-size:23px;margin-bottom:12px}
.card h2 .badge{vertical-align:middle;font-family:'Atkinson Hyperlegible',sans-serif}
.sec-t{font-family:'Alfa Slab One',serif;font-size:20px;color:var(--tinta);margin:24px 2px 10px}

.kpis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.kpi{background:#fff;border:2px solid var(--tinta);border-top:7px solid var(--pasto);border-radius:12px;padding:10px 12px}
.kpi .l{font-size:14px;color:var(--tinta2);line-height:1.25;font-weight:700}
.kpi .v{font-family:'Alfa Slab One',serif;font-size:clamp(19px,5.6vw,25px);overflow-wrap:anywhere;line-height:1.15;margin-top:4px}
.kpi .s{font-size:13px;color:var(--tinta2);margin-top:2px}
.kpi.g{border-top-color:var(--pasto)} .kpi.a{border-top-color:var(--ipe)} .kpi.r{border-top-color:var(--verm)} .kpi.n{border-top-color:#a9a293}

.badge{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1.5px solid currentColor}
.badge.g{background:var(--pasto-claro);color:#285a1a}.badge.a{background:var(--ipe-claro);color:#7a5300}.badge.r{background:#f8dcd5;color:#8f2410}.badge.n{background:#eeebe3;color:#5c554a}

table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:9px 4px;text-align:right;border-bottom:1.5px solid var(--linha)}
th:first-child,td:first-child{text-align:left}
th{font-size:14px;color:var(--tinta2);font-weight:700}
td.neg{color:var(--verm);font-weight:700}

/* ---- barra de baixo: a barra azul da parede caiada ---- */
nav.bot{position:fixed;bottom:0;left:0;right:0;background:var(--anil);border-top:4px solid var(--tinta);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:1000}
nav.bot .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr 1fr;align-items:end}
nav.bot button{background:none;border:0;padding:6px 0 2px;font-size:14px;font-weight:700;color:#dfe7f5;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button .i{font-size:26px;line-height:1}
nav.bot button.on{color:var(--ipe)}
nav.bot button.on .i{transform:translateY(-2px)}
nav.bot .anotar{color:#fff}
nav.bot .anotar .mais{width:70px;height:70px;margin-top:-34px;border-radius:50%;background:var(--ipe);border:3px solid var(--tinta);box-shadow:3px 3px 0 var(--tinta);display:flex;align-items:center;justify-content:center;font-family:'Alfa Slab One',serif;font-size:42px;color:var(--tinta);line-height:1}
nav.bot .anotar.on{color:var(--ipe)}

/* ---- tela Anotar ---- */
.grid-ev{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ev{background:#fff;border:2px solid var(--tinta);border-radius:16px;box-shadow:3px 3px 0 var(--tinta);padding:14px 10px 12px;text-align:center;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ev:active,.btn:active,.ck:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.ev .i{width:58px;height:58px;border-radius:50%;border:2px solid var(--tinta);background:color-mix(in srgb, var(--c) 22%, white);display:flex;align-items:center;justify-content:center;font-size:29px}
.ev .t{font-weight:700;font-size:18px;line-height:1.2}
.ev .d{font-size:14px;color:var(--tinta2);line-height:1.2}

/* ---- formulários grandes ---- */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:16px;color:var(--tinta);margin-bottom:5px;font-weight:700}
label.f>span em{font-weight:400;color:var(--tinta2)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;padding:13px 12px;border:2px solid #b9b09e;border-radius:12px;background:#fff;font-size:18px;min-height:52px}
input:focus,select:focus,textarea:focus{border-color:var(--tinta);outline:3px solid var(--ipe);outline-offset:0}
textarea{min-height:70px;resize:vertical}
.step{display:flex;align-items:stretch;border:2px solid var(--tinta);border-radius:14px;overflow:hidden;background:#fff}
.step button{width:52px;flex:none;border:0;background:var(--pasto-claro);font-size:30px;color:var(--pasto);font-weight:700}
.step input{border:0!important;border-radius:0!important;padding:10px 0!important;text-align:center;font-size:26px!important;font-weight:700;flex:1;min-width:0;outline:0!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:block;width:100%;padding:14px;min-height:56px;border:2px solid var(--tinta);border-radius:14px;background:var(--pasto);color:#fff;font-weight:700;font-size:19px;box-shadow:3px 3px 0 var(--tinta)}
.btn.sec{background:#fff;color:var(--tinta)}
.btn.sm{padding:10px 12px;font-size:16px;min-height:48px}
.btn.in{display:inline-block;width:auto}
.btn.del{background:#fff;color:var(--verm)}
.btn:disabled{opacity:.45}
.lnk{background:none;border:0;color:var(--anil);font-weight:700;padding:6px 0;font-size:16px;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:15px;color:var(--tinta2);margin-top:5px}
.warn{font-size:15px;color:var(--verm);margin-top:5px;font-weight:700}
.muted{color:var(--tinta2);font-size:16px}
.empty{text-align:center;color:var(--tinta2);padding:18px 6px;font-size:16px}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1.5px solid var(--linha)}
.item:last-child{border-bottom:0}
.item .ic{width:42px;height:42px;border-radius:50%;border:2px solid var(--tinta);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block}.item .tx small{color:var(--tinta2);font-size:14px}
.item .x{background:none;border:0;color:#9b9384;font-size:22px;padding:4px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips select{width:auto;padding:10px;font-size:16px}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;max-width:560px;bottom:112px;justify-content:space-between;background:var(--tinta);color:#fff;padding:12px 16px;border-radius:14px;font-size:16px;display:flex;gap:16px;align-items:center;z-index:3000;max-width:92vw;box-shadow:3px 3px 0 var(--ipe)}
.toast span{flex:1}
.toast button{background:none;border:0;color:var(--ipe);font-weight:700;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(30,25,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:2000}
.modal .box{background:#fff;border:3px solid var(--tinta);border-bottom:0;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;max-height:92vh;overflow:auto}
.modal .box h2{font-size:23px;margin-bottom:14px}
.modal .acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.login{max-width:400px;margin:60px auto;padding:0 18px}
.login h1{font-size:36px;color:var(--pasto);margin-bottom:6px}
ol.onb{margin:6px 0 0;padding-left:24px;line-height:1.75;font-size:17px}
.tag{font-size:13px;background:var(--pasto-claro);color:#285a1a;padding:2px 8px;border-radius:12px;font-weight:700;border:1.5px solid currentColor;font-family:'Atkinson Hyperlegible',sans-serif}
.gcats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gc input{position:absolute;opacity:0;pointer-events:none}
.gc span{display:block;padding:12px 10px;border:2px solid #b9b09e;border-radius:12px;background:#fff;font-size:16px;font-weight:700}
.gc input:checked+span{border-color:var(--tinta);background:var(--ipe-claro);box-shadow:2px 2px 0 var(--tinta)}
.gc input:focus-visible+span{outline:3px solid var(--ipe)}
.bar{height:10px;border-radius:6px;background:var(--ipe);margin-top:5px;border:1.5px solid var(--tinta)}
.gl{padding:9px 0;border-bottom:1.5px solid var(--linha);font-size:16px}.gl:last-child{border-bottom:0}
.gl .h{display:flex;justify-content:space-between;gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chk label{display:flex;align-items:center;gap:6px;border:2px solid #b9b09e;border-radius:12px;padding:9px 11px;font-size:16px;background:#fff}
.sn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1.5px solid var(--linha);font-size:16px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;text-align:center}
.res div{background:var(--cal);border:2px solid var(--tinta);border-radius:12px;padding:9px 4px}
.res b{display:block;font-family:'Alfa Slab One',serif;font-size:clamp(14px,4.2vw,18px);overflow-wrap:anywhere;font-weight:400}
.res small{font-size:14px;color:var(--tinta2);font-weight:700}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1.5px dashed #d9c27a;font-size:16px}
.alerta:last-child{border-bottom:0}
.alerta .dot{width:14px;height:14px;border-radius:50%;margin-top:4px;flex:none;border:2px solid var(--tinta)}

/* ---- lida do dia ---- */
.tk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px solid var(--linha)}.tk:last-child{border-bottom:0}
.tk .ck{width:54px;height:54px;border-radius:14px;border:2.5px solid var(--tinta);background:#fff;font-size:28px;color:#fff;flex:none;font-weight:700;box-shadow:2px 2px 0 var(--tinta)}
.tk.feito .ck{background:var(--pasto)}.tk.feito .tx b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.tk .tx{flex:1;min-width:0}.tk .tx b{display:block;font-size:18px}.tk .tx small{color:var(--tinta2);font-size:14px}
.tk .prob{background:none;border:2px solid var(--verm);color:var(--verm);border-radius:10px;padding:6px 8px;font-size:14px;font-weight:700}
.trilha{position:relative;height:26px;margin:4px 0 12px;border-bottom:3px solid var(--madeira)}
.trilha .poste{position:absolute;bottom:-3px;width:5px;height:22px;background:var(--madeira);border-radius:2px 2px 0 0}
.trilha .ripa{position:absolute;left:0;right:0;bottom:12px;height:3px;background:var(--madeira);opacity:.55}
.trilha .anda{position:absolute;bottom:0;width:38px;transition:left .8s ease;color:var(--tinta)}
.trilha .curral{position:absolute;right:-2px;bottom:-1px;font-size:22px}

/* ---- boiada ---- */
.curral-g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;align-items:end}
.curral-g .cur svg{display:block;margin:0 auto 4px;color:var(--tinta);height:auto}
.curral-g b{display:block;font-family:'Alfa Slab One',serif;font-size:25px;font-weight:400;line-height:1.1}
.curral-g span{font-size:13px;color:var(--tinta2);font-weight:700;line-height:1.15;display:block}
.totalb{margin:14px 0 0;padding-top:10px;border-top:2px dashed var(--linha);font-size:17px}

/* ---- régua dos índices ---- */
.regua{padding:10px 0;border-bottom:1.5px solid var(--linha)}.regua:last-child{border-bottom:0}
.regua .q{font-size:17px}.regua .q b{font-family:'Alfa Slab One',serif;font-weight:400;font-size:20px}
.regua .trilho{height:12px;border:2px solid var(--tinta);border-radius:8px;background:#efece4;margin-top:6px;overflow:hidden}
.regua .trilho i{display:block;height:100%}
.regua small{color:var(--tinta2);font-size:14px}

/* ---- fivela ---- */
.fivela{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.fivela svg{width:150px;height:auto;display:block}
.fivela .nivel{font-family:'Alfa Slab One',serif;font-size:22px;line-height:1.1}
.pilar{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;font-size:14px;align-items:center;margin-top:5px}
.pilar .tr{grid-column:1/-1;height:8px;border-radius:5px;background:#efece4;border:1.5px solid var(--tinta);overflow:hidden}
.pilar .tr i{display:block;height:100%;background:var(--pasto)}
.subir{margin:14px 0 0;padding:12px;background:var(--ipe-claro);border:2px dashed var(--ipe2);border-radius:12px;font-size:16px}
.subir li{margin:4px 0}

/* ---- prêmios ---- */
.premios{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;text-align:center}
.premio{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.premio .m{width:62px;height:62px;border-radius:50%;border:3px solid var(--tinta);display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--ipe);box-shadow:2px 2px 0 var(--tinta);position:relative}
.premio .m:after{content:'';position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(42,35,27,.55)}
.premio.bloq .m{background:#ebe7de;filter:grayscale(1);opacity:.55;box-shadow:none;border-style:dashed}
.premio span{font-size:13px;font-weight:700;line-height:1.15}
.premio.bloq span{color:var(--tinta2);font-weight:400}

/* ---- previsão ---- */
.prev{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-bottom:12px}
.prev div{border:2px solid var(--tinta);border-radius:12px;padding:6px 0;background:#fff;font-size:13px;line-height:1.3}
.prev div.hj{background:var(--ipe-claro)}
.prev b{display:block;font-size:14px}
.prev .e{font-size:21px;display:block}
.prev .mm{color:var(--anil);font-weight:700}

/* ---- menu Mais ---- */
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--tinta);border-radius:16px;box-shadow:3px 3px 0 var(--tinta);padding:16px;margin-bottom:14px}
.mi .ic{font-size:30px;width:56px;height:56px;border-radius:50%;border:2px solid var(--tinta);display:flex;align-items:center;justify-content:center;background:var(--ipe-claro);flex:none}
.mi b{display:block;font-family:'Alfa Slab One',serif;font-weight:400;font-size:21px}
.mi small{color:var(--tinta2);font-size:15px}

/* ---- comemoração ---- */
.festa{position:fixed;inset:0;z-index:2500;background:rgba(30,25,18,.55);display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.festa .quadro{position:relative;background:#fff;border:3px solid var(--tinta);border-radius:22px;box-shadow:5px 5px 0 var(--tinta);padding:26px 20px 20px;max-width:380px;width:100%;text-align:center;animation:surge .45s cubic-bezier(.2,1.4,.4,1) both}
.festa .selo{width:110px;height:110px;margin:-82px auto 10px;border-radius:50%;border:3px solid var(--tinta);background:var(--ipe);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:3px 3px 0 var(--tinta)}
.festa .selo.premio-s{background:radial-gradient(circle at 35% 30%,#ffe98a,#e0a400 70%)}
.festa h2{font-size:30px;margin-bottom:8px}
.festa p{font-size:18px;margin:0 0 18px}
.festa .flor{position:absolute;top:-20px;width:12px;height:12px;border-radius:50% 0 50% 0;background:var(--ipe);border:1px solid var(--ipe2);animation:cai linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes surge{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

#map{height:58vh;width:100%}
.leaflet-tooltip.lbl{background:rgba(255,255,255,.9);border:0;box-shadow:none;font:700 12px 'Atkinson Hyperlegible',sans-serif;padding:2px 6px;text-align:center}
.leaflet-tooltip.lbl:before{display:none}
.drawbar{display:none;gap:8px;margin-top:10px}
.drawbar.on{display:grid;grid-template-columns:1fr 1fr 1fr}
.pin{font-size:24px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}

@media (max-width:360px){ .ev{min-height:118px} .curral-g b{font-size:21px} .fivela{grid-template-columns:120px 1fr} .fivela svg{width:120px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Nelore de perfil, virado pra esquerda: cupim, barbela e orelha caída -->
  <symbol id="boi" viewBox="0 0 64 42">
    <g fill="currentColor">
      <path d="M13 15 C14 11 18 10 22 10 L50 11 C58 11 61 15 61 21 C61 27 58 29 55 29 L20 29 C15 29 12 25 12 21 Z"/>
      <ellipse cx="22" cy="10" rx="6.5" ry="5.5"/>

/* projeção cilíndrica de área igual no elipsoide WGS84/SIRGAS 2000: área exata para polígonos de fazenda */
const ELA = 6378137, ELE = Math.sqrt(0.00669438002290);
const qLat = f => { const s = Math.sin(f), es = ELE*s; return (1-ELE*ELE)*(s/(1-es*es) - Math.log((1-es)/(1+es))/(2*ELE)); };

  const m2 = g.type === 'Polygon' ? poly(g.coordinates) : g.type === 'MultiPolygon' ? g.coordinates.reduce((s,p) => s + poly(p), 0) : 0;
  return m2 / 1e4;
}

  catch(e){ db = fs.getFirestore(app); }
  const auth = au.getAuth(app);
  let unsubs = [];
  const erro = e => toast('Erro ao salvar: ' + (e.code || e.message));
  return {
    auth, au,
    subscribe(c, cb){
      if (c === 'config') unsubs.push(fs.onSnapshot(fs.doc(db,'config','geral'), d => cb(d.exists() ? d.data() : {}), e => toast('Erro: ' + e.code)));
      else unsubs.push(fs.onSnapshot(fs.collection(db, c), s => cb(s.docs.map(d => ({...d.data(), id:d.id}))), e => toast('Erro: ' + e.code)));
    },
    add(c, o){ const ref = fs.doc(fs.collection(db, c)); fs.setDoc(ref, o).catch(erro); return ref.id; },
    update(c, id, o){ fs.updateDoc(fs.doc(db, c, id), o).catch(erro); },
    remove(c, id){ fs.deleteDoc(fs.doc(db, c, id)).catch(erro); },
    setConfig(o){ fs.setDoc(fs.doc(db,'config','geral'), o, {merge:true}).catch(erro); },
    stop(){ unsubs.forEach(u => u()); unsubs = []; }
  };
}

const lotePor = id => S.lotes.find(l => l.id === id);

const noPeriodo = (e, dias) => e.data > diasAtras(dias) && e.data <= hoje();

function saldos(ate){
  const R = {};
  const add = (l, c, n) => { if (!l) return; R[l] = R[l] || {}; R[l][c] = (R[l][c] || 0) + n; };
  for (const e of ordenar(S.lanc)){
    if (ate && e.data > ate) continue;
    switch (e.tipo){
      case 'contagem':
        for (const c of CAT_K){ const v = e.contagens?.[c]; if (v !== undefined && v !== null && v !== ''){ R[e.loteId] = R[e.loteId] || {}; R[e.loteId][c] = N(v); } }
        break;
      case 'parto':
        add(e.loteId, 'bezerro', N(e.machos) + N(e.femeas));
        if (N(e.primiparas)){ add(e.loteId, 'novilha', -N(e.primiparas)); add(e.loteId, 'vaca', N(e.primiparas)); }
        break;
      case 'morte': case 'saida': add(e.loteId, e.cat, -N(e.qtd)); break;
      case 'entrada': add(e.loteId, e.cat, N(e.qtd)); break;
      case 'transferencia':
        add(e.loteId, e.cat, -N(e.qtd));
        add(e.loteDestino || e.loteId, e.catDestino || e.cat, N(e.qtd));
        break;
      case 'desmama': {
        const t = N(e.machos) + N(e.femeas);
        add(e.loteId, 'bezerro', -t);
        if (e.loteDestino) add(e.loteDestino, 'recria', t);
        break;
      }
    }
  }
  return R;
}

function indicadores(){
  const sal = saldos();
  const tot = Object.fromEntries(CAT_K.map(c => [c, 0]));
  let expostas = 0, tourosMonta = 0;
  for (const [lid, cs] of Object.entries(sal)){
    for (const c of CAT_K) tot[c] += cs[c] || 0;
    if (lotePor(lid)?.tipo === 'monta'){ expostas += (cs.vaca||0) + (cs.novilha||0); tourosMonta += cs.touro || 0; }
  }
  const touros = tourosMonta || tot.touro;
  const rec = S.lanc.filter(e => noPeriodo(e, 365));
  let machos=0, femeas=0, natim=0, mortBez=0, desm=0, pesoSoma=0, pesoN=0, receita=0, gastos=0, vendidos=0;
  for (const e of rec){
    if (e.tipo === 'parto'){ machos += N(e.machos); femeas += N(e.femeas); natim += N(e.mortos); }
    if (e.tipo === 'morte' && e.cat === 'bezerro') mortBez += N(e.qtd);
    if (e.tipo === 'desmama'){ const t = N(e.machos)+N(e.femeas); desm += t; if (N(e.peso)){ pesoSoma += N(e.peso)*t; pesoN += t; } }
    if ((e.tipo === 'saida' || e.tipo === 'desmama') && N(e.valor)){ receita += N(e.valor); vendidos += e.tipo === 'saida' ? N(e.qtd) : N(e.machos)+N(e.femeas); }
    if (e.tipo === 'gasto') gastos += N(e.valor);
  }
  /* toque: último toque de cada lote nos últimos 12 meses */
  const ultToque = {};
  for (const e of ordenar(rec)) if (e.tipo === 'toque') ultToque[e.loteId] = e;
  let prenhes = 0, vazias = 0;
  for (const e of Object.values(ultToque)){ prenhes += N(e.prenhes); vazias += N(e.vazias); }
  const vivos = machos + femeas, nasc = vivos + natim;
  const primeira = S.lanc.length ? ordenar(S.lanc)[0].data : null;
  return {
    sal, tot, expostas, touros, machos, femeas, natim, vivos, nasc, mortBez, desm, receita, gastos, vendidos, prenhes, vazias, ultToque,
    rebanho: CAT_K.reduce((s,c) => s + tot[c], 0),
    natalidade: expostas ? nasc/expostas : null,
    mortalidade: nasc ? (natim + mortBez)/nasc : null,
    desmama: vivos ? desm/vivos : null,
    pesoDesm: pesoN ? pesoSoma/pesoN : null,
    relacao: touros ? expostas/touros : null,
    prenhez: (prenhes + vazias) ? prenhes/(prenhes + vazias) : null,
    temDados: S.lanc.length > 0,
    parcial: !!primeira && primeira > diasAtras(365)
  };
}

function statusSanidade(){

    for (const a of alvos){
      const ult = aps.filter(e => a === null || !e.loteId || e.loteId === a).map(e => e.data).sort().pop() || null;
      let estado, prazo, rot;
      if (p.modo === 'meses'){
        const m = +h.slice(5,7), y = +h.slice(0,4);
        const ms = (p.meses || []).map(Number).sort((a,b) => a-b);
        if (ms.includes(m)){ prazo = fimMes(h); estado = ult && ult.slice(0,7) === h.slice(0,7) ? 'ok' : 'pendente'; rot = estado === 'ok' ? 'feito em ' + fmtD(ult) : 'fazer até ' + fmtD(prazo); }
        else { estado = 'ok'; const nx = ms.find(x => x > m) ?? ms[0]; prazo = nx ? `${nx > m ? y : y+1}-${pad(nx)}-01` : null; rot = prazo ? 'próxima: ' + fmtMes(prazo) : ''; }
      } else {
        if (!ult){ estado = 'pendente'; prazo = null; rot = 'sem registro'; }
        else { prazo = somaDias(ult, N(p.dias) || 365); estado = prazo < h ? 'vencido' : prazo <= em15 ? 'proximo' : 'ok'; rot = (estado === 'vencido' ? 'venceu em ' : 'próxima até ') + fmtD(prazo); }

const SEM_SAN = {ok:'g', proximo:'a', pendente:'a', vencido:'r'};

function lotacao(sal){

    for (const l of ls) for (const k of CAT_K){ const n = Math.max(0, sal[l.id]?.[k] || 0); ua += n * N(c.ua[k]); cab += n; }
    const cap = N(p.cap) || N(c.uaHa) || 1, area = N(p.area);
    const uaha = area ? ua/area : null;
    const sem = uaha == null ? 'n' : uaha <= cap ? 'g' : uaha <= cap*1.15 ? 'a' : 'r';

}

function consumoSal(I){
  const c = cfg(), compras = S.lanc.filter(e => e.tipo === 'gasto' && e.gcat === 'sal' && N(e.qtd) && noPeriodo(e, 90));
  if (!compras.length) return null;

}

  const A = [], h = hoje();
  for (const [lid, cs] of Object.entries(I.sal)) for (const c of CAT_K)
    if ((cs[c]||0) < 0) A.push({n:'r', t:`<b>${esc(nomeLote(lid))}</b>: saldo negativo de ${CATS_C[c]} (${fmtN(cs[c])}). Faça uma contagem de curral.`});
  for (const s of statusSanidade()){
    if (s.estado === 'ok') continue;
    const onde = s.alvo ? ' · ' + esc(nomeLote(s.alvo)) : '';
    A.push({n: s.estado === 'vencido' || (s.p.obrig && s.estado === 'pendente') ? 'r' : 'a', t:`<b>${esc(s.p.nome)}</b>${onde}: ${TXT_SAN[s.estado]} (${s.rot})`, go:{prot:s.p.id, lote:s.alvo}});
  }
  for (const L of lotacao(I.sal)) if (L.sem === 'r' || L.sem === 'a')
    A.push({n:L.sem, t:`<b>${esc(L.p.nome)}</b>: lotação de ${fmtN(L.uaha,2)} UA/ha (capacidade ${fmtN(L.cap,1)}).`});
  if (I.temDados) for (const l of S.lotes.filter(l => l.ativo !== false)){
    const tem = Object.values(I.sal[l.id] || {}).some(v => v > 0); if (!tem) continue;
    const ult = S.lanc.filter(e => e.tipo === 'contagem' && e.loteId === l.id).map(e => e.data).sort().pop();
    if (!ult) A.push({n:'a', t:`<b>${esc(l.nome)}</b>: nunca teve contagem de curral.`});
    else if (difDias(ult, h) > 90) A.push({n:'a', t:`<b>${esc(l.nome)}</b>: última contagem há ${difDias(ult, h)} dias.`});
  }
  for (const s of statusTarefas()) if (s.atraso >= 1) A.push({n:'a', t:`Tarefa <b>${esc(s.t.nome)}</b> atrasada ${s.atraso} dia${s.atraso > 1 ? 's' : ''}.`});
  for (const e of S.lanc.filter(e => e.tipo === 'tarefa' && e.problema && noPeriodo(e, 7))) A.push({n:'r', t:`Problema em <b>${esc(e.tarefaNome)}</b> (${fmtD(e.data)}): ${esc(e.obs)}`});
  const montas = S.lotes.filter(l => l.ativo !== false && l.tipo === 'monta');
  if (I.temDados && montas.length && !montas.some(l => I.ultToque[l.id]))
    A.push({n:'a', t:'Nenhum <b>toque</b> nos lotes de monta nos últimos 12 meses. Um toque por ano mostra as vazias pra descarte.'});
  return A.sort((a,b) => (a.n === 'r' ? 0 : 1) - (b.n === 'r' ? 0 : 1));
}

/* ---------- interface ---------- */
function toast(msg, desfazer){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>` + (desfazer ? '<button>Desfazer</button>' : '');
  if (desfazer) t.querySelector('button').onclick = () => { desfazer(); t.remove(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}
function confirmar(msg, okTxt='Excluir'){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><p style="margin:0 0 4px;font-size:16px">${esc(msg)}</p><div class="acts"><button class="btn sec" data-r="0">Cancelar</button><button class="btn" style="background:var(--verm)" data-r="1">${esc(okTxt)}</button></div></div>`;
    m.onclick = ev => { const r = ev.target.dataset.r; if (r !== undefined || ev.target === m){ m.remove(); res(r === '1'); if (S.view !== 'form') atualizar(); } };
    document.body.appendChild(m);
  });
}
function modalForm(titulo, inner, onOk, okTxt='Salvar', depois){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h2>${titulo}</h2><form>${inner}<p class="warn" data-err></p><div class="acts"><button type="button" class="btn sec" data-c>Cancelar</button><button class="btn">${esc(okTxt)}</button></div></form></div>`;
  const fm = m.querySelector('form');
  const fechar = () => { m.remove(); atualizar(); };
  m.querySelector('[data-c]').onclick = fechar;
  fm.onsubmit = ev => { ev.preventDefault(); const r = onOk(new FormData(fm), fm, msg => { m.querySelector('[data-err]').textContent = msg; }); if (r !== false) fechar(); };
  document.body.appendChild(m);
  depois?.(fm);
}

/* Login por usuário: o Firebase só aceita e-mail, então "luiz" vira "luiz@<domínio do projeto>" por baixo.
   No console, cada usuário é criado com esse e-mail interno. */
const DOMINIO_LOGIN = 'fazenda-barro-vermelho-8d3d6.firebaseapp.com';
const paraEmail = u => { u = (u || '').trim().toLowerCase(); if (u.includes('@')) return u;
  return u.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._-]/g, '') + '@' + DOMINIO_LOGIN; };
const usuarioAtual = () => { const e = S.user?.email || ''; return e.endsWith('@' + DOMINIO_LOGIN) ? e.split('@')[0] : e || (MODO_TESTE ? 'teste' : ''); };
function telaLogin(){
  let u = ''; try { u = localStorage.getItem('manejo_usuario') || ''; } catch(e){}
  return `<div class="login"><div style="text-align:center;margin-bottom:14px"><img src="icone-192.png" alt="" width="96" height="96" style="border:3px solid var(--tinta);border-radius:22px;box-shadow:3px 3px 0 var(--tinta)" onerror="this.remove()"></div>

    <label class="f"><span>Senha</span><input type="password" id="lg-s" autocomplete="current-password"></label>
    <button class="btn" id="lg-b">Entrar</button><p class="warn" id="lg-err" role="alert"></p></div>`;

function ligarLogin(){
  const go = async () => {
    const u = $('#lg-u').value.trim(), s = $('#lg-s').value;
    if (!u || !s){ $('#lg-err').textContent = 'Digite o usuário e a senha.'; return; }
    $('#lg-b').disabled = true; $('#lg-b').textContent = 'Entrando…'; $('#lg-err').textContent = '';
    try { localStorage.setItem('manejo_usuario', u); } catch(_){}
    try { await Store.au.signInWithEmailAndPassword(Store.auth, paraEmail(u), s); }
    catch(err){
      const c = err.code || '';
      $('#lg-err').textContent = c.includes('network') ? 'Sem internet agora. Tente de novo quando pegar sinal.'
        : c.includes('too-many') ? 'Muitas tentativas. Espere uns minutos e tente de novo.'
        : 'Usuário ou senha não conferem.';
      $('#lg-b').disabled = false; $('#lg-b').textContent = 'Entrar';
    }
  };
  $('#lg-b').onclick = go;
  $('#lg-s').onkeydown = ev => { if (ev.key === 'Enter') go(); };
}

const clamp = x => Math.max(0, Math.min(1, x));
function prevBaixas(dias){
  const ini = diasAtras(dias), tk = S.lanc.filter(e => e.tipo === 'tarefa' && e.data > ini && e.data <= hoje());
  const prev = S.tarefas.filter(t => t.ativo !== false).reduce((s,t) => s + Math.max(1, Math.floor(dias / (N(t.freq) || 1))), 0);
  return {prev, feitas: tk.length};
}
function fivela(I){
  const P = [];

  P.push({n:'Reprodução', p:pRep, dica: r == null ? 'Fazer o toque e anotar prenhas e vazias' : pRep < 20 ? 'Subir a prenhez: tocar e descartar as vazias' : ''});
  const m = I.mortalidade, pBez = m == null ? 10 : Math.round(clamp((.10 - m) / .07) * 20);
  P.push({n:'Bezerro vivo', p:pBez, dica: m == null ? 'Anotar os nascimentos' : pBez < 20 ? 'Ronda nas paridas pra perder menos bezerro' : ''});
  const st = statusSanidade(), okS = st.filter(s => s.estado === 'ok').length;
  const pSau = !S.protocolos.length ? 0 : st.length ? Math.round(okS / st.length * 20) : 20;
  const pend = st.find(s => s.estado !== 'ok');
  P.push({n:'Vacina em dia', p:pSau, dica: !S.protocolos.length ? 'Carregar as vacinas de Goiás na aba Saúde' : pend ? `Pôr em dia: ${pend.p.nome}${pend.alvo ? ' (' + nomeLote(pend.alvo) + ')' : ''}` : ''});
  const b = prevBaixas(7), pLida = !S.tarefas.length ? 0 : Math.round(clamp(b.feitas / Math.max(1, b.prev)) * 20);
  P.push({n:'Lida feita', p:pLida, dica: !S.tarefas.length ? 'Cadastrar a lida do vaqueiro (Mais → Cadastros)' : pLida < 20 ? 'Dar baixa na lida todo dia' : ''});
  const dias = new Set(S.lanc.filter(e => noPeriodo(e, 14) && e.tipo !== 'tarefa').map(e => e.data)).size;
  const pCad = Math.round(clamp(dias / 8) * 20);
  P.push({n:'Caderno em dia', p:pCad, dica: pCad < 20 ? 'Anotar o que acontece no pasto mais dias da semana' : ''});
  const total = P.reduce((s,x) => s + x.p, 0);
  return {total, pilares:P, nivel: total >= 80 ? 'Ouro' : total >= 60 ? 'Prata' : total >= 40 ? 'Bronze' : 'Cobre'};
}
function sequenciaLida(){
  const diarias = S.tarefas.filter(t => t.ativo !== false && (N(t.freq) || 1) === 1);
  if (!diarias.length) return 0;
  const feito = d => diarias.every(t => S.lanc.some(e => e.tipo === 'tarefa' && e.tarefaId === t.id && e.data === d));
  let d = hoje(), n = 0;
  if (!feito(d)) d = somaDias(d, -1);
  while (feito(d) && n < 400){ n++; d = somaDias(d, -1); }
  return n;
}

async function checarPremios(){

  if (ga.length){ const por = {}; for (const e of ga) por[e.gcat] = (por[e.gcat]||0) + N(e.valor);
    L.push(`💰 Gastos: ${fmtR(soma(ga, e => e.valor))} (${Object.entries(por).sort((a,b) => b[1]-a[1]).map(([k,v]) => `${GASTOS[k]?.n || k} ${fmtR(v)}`).join(', ')})`); }
  const ch = so('chuva'); L.push(`🌧️ Chuva: ${ch.length ? fmtN(soma(ch, e => e.mm)) + ' mm' : 'nenhuma registrada'}`);
  const sa = so('sanitario'); if (sa.length) L.push(`🧪 Sanidade: ${sa.map(e => `${protPor(e.protId)?.nome || e.protNome} (${nomeLote(e.loteId)})`).join('; ')}`);
  if (S.tarefas.length){
    const prev = S.tarefas.filter(t => t.ativo !== false).reduce((s,t) => s + Math.max(1, Math.floor(7 / (N(t.freq) || 1))), 0);
    const tk = so('tarefa'), prob = tk.filter(e => e.problema);
    L.push(`✅ Tarefas: ${tk.length} baixas de ~${prev} previstas${prob.length ? ` (${prob.length} com problema)` : ''}`);
    for (const e of prob) L.push(`   ⚠️ ${e.tarefaNome} (${fmtD(e.data)}): ${e.obs}`);
  }
  L.push('', `🐂 Rebanho hoje: ${fmtN(I.rebanho)} cabeças (${CAT_K.filter(c => I.tot[c]).map(c => `${fmtN(I.tot[c])} ${CATS_C[c]}`).join(', ')})`);
  const A = alertas(I).filter(a => !/^Problema em/.test(a.t.replace(/<[^>]+>/g, '')));
  if (A.length){ L.push('', `⚠️ Alertas (${A.length}):`); A.slice(0, 6).forEach(a => L.push('• ' + a.t.replace(/<[^>]+>/g, '').replace(/&amp;/g,'&'))); if (A.length > 6) L.push(`• e mais ${A.length - 6}…`); }
  return L.join('\n');
}

function statusTarefas(){
  const h = hoje();
  return S.tarefas.filter(t => t.ativo !== false).map(t => {
    const ult = S.lanc.filter(e => e.tipo === 'tarefa' && e.tarefaId === t.id).map(e => e.data).sort().pop() || null;
    const f = N(t.freq) || 1, feito = !!ult && difDias(ult, h) < f;
    const atraso = feito ? 0 : ult ? Math.max(0, difDias(somaDias(ult, f), h)) : 0;
    return {t, ult, feito, atraso, f};
  }).sort((a,b) => (a.feito - b.feito) || (b.atraso - a.atraso) || a.t.nome.localeCompare(b.t.nome));
}

      case 'parto':
        Object.assign(o, {machos:N(v.machos), femeas:N(v.femeas), mortos:N(v.mortos), primiparas:N(v.primiparas), brincos:(v.brincos||'').trim()});
        if (o.machos + o.femeas + o.mortos === 0) return err('Informe pelo menos um bezerro.');
        if (o.primiparas > o.machos + o.femeas + o.mortos) return err('Mães novilhas não pode passar do total de partos.');
        break;
      case 'morte': Object.assign(o, {cat:v.cat, qtd:N(v.qtd), causa:v.causa}); if (!o.qtd) return err('Quantidade deve ser maior que zero.'); break;
      case 'desmama': {
        Object.assign(o, {machos:N(v.machos), femeas:N(v.femeas), peso:N(v.peso)||null, loteDestino:v.loteDestino||null});
        if (!o.machos && !o.femeas) return err('Informe quantos foram desmamados.');
        const vc = o.loteDestino ? 0 : moeda(v.valorCab);
        if (vc){ o.valorCab = vc; o.valor = vc * (o.machos + o.femeas); }
        break;
      }
      case 'toque': Object.assign(o, {prenhes:N(v.prenhes), vazias:N(v.vazias)}); if (!o.prenhes && !o.vazias) return err('Informe prenhas e vazias.'); break;
      case 'sanitario': if (!p) return err('Escolha o protocolo.'); Object.assign(o, {protId:p.id, protNome:p.nome, qtd:N(v.qtd)||null, produto:(v.produto||'').trim()}); if (p.alvo === 'fazenda') o.loteId = null; break;
      case 'entrada': Object.assign(o, {cat:v.cat, qtd:N(v.qtd), motivo:v.motivo}); if (!o.qtd) return err('Quantidade deve ser maior que zero.'); break;
      case 'saida': {
        Object.assign(o, {cat:v.cat, qtd:N(v.qtd), motivo:v.motivo, peso:N(v.peso)||null});
        if (!o.qtd) return err('Quantidade deve ser maior que zero.');
        const vc = ['Venda','Descarte'].includes(o.motivo) ? moeda(v.valorCab) : 0;
        if (vc){ o.valorCab = vc; o.valor = vc * o.qtd; }
        break;
      }
      case 'transferencia': Object.assign(o, {cat:v.cat, qtd:N(v.qtd), loteDestino:v.loteDestino||null, catDestino:v.catDestino||null});
        if (!o.qtd) return err('Quantidade deve ser maior que zero.');
        if (!o.loteDestino && !o.catDestino) return err('Escolha outro lote ou outra categoria.');
        if (o.loteDestino === o.loteId && (!o.catDestino || o.catDestino === o.cat)) return err('Destino igual à origem.');
        break;
      case 'contagem': {
        const ct = {}; for (const c of CAT_K){ const x = v['ct_' + c]; if (x !== '' && x != null) ct[c] = N(x); }
        if (!Object.keys(ct).length) return err('Digite pelo menos uma categoria.');
        o.contagens = ct; break;
      }
      case 'gasto': Object.assign(o, {gcat:v.gcat, valor:moeda(v.valor), qtd:N(v.qtd)||null, unid:v.unid||''});
        if (!(o.valor > 0)) return err('Informe o valor do gasto.'); break;
      case 'chuva': o.mm = N(v.mm); if (!(o.mm > 0)) return err('Informe os milímetros.'); break;
    }
    const id = Store.add('lancamentos', o);
    if (o.loteId && !['gasto','sanitario'].includes(tipo)) try { localStorage.setItem('manejo_ultimo_lote', o.loteId); } catch(e){}
    const volta = tipo === 'sanitario' && S.form.voltar ? S.form.voltar : 'lancar';
    S.view = volta; S.form = null; render();
    posSalvar(tipo, o, id);
  };
}

/* ---------- mapa ---------- */
const distM = (a, b) => { const R = 6371008.8, r = Math.PI/180, dLat = (b[1]-a[1])*r, dLon = (b[0]-a[0])*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const compM = c => c.slice(1).reduce((s, p, i) => s + distM(c[i], p), 0);
function listaBenf(){
  if (!S.benf.length) return '<p class="hint">Nenhuma benfeitoria marcada ainda.</p>';
  const cercas = S.benf.filter(b => b.tipo === 'cerca');
  const totM = cercas.reduce((s,b) => s + N(b.metros), 0), arame = cercas.reduce((s,b) => s + N(b.metros)*N(b.fios), 0);
  const ord = [...S.benf].sort((a,b) => (a.tipo === 'cerca' ? 0 : 1) - (b.tipo === 'cerca' ? 0 : 1) || (a.nome||'').localeCompare(b.nome||''));
  return (cercas.length ? `<div class="banner" style="background:#fdf1e2;border-color:#f0cfa2;color:#7a4d12">Cercas: <b>${fmtN(totM)} m</b>${arame ? ` · arame: <b>${fmtN(arame)} m</b>` : ''}${cercas.some(b => !N(b.fios)) ? ' · informe os fios para calcular o arame de todas' : ''}</div>` : '') +
    ord.map(b => `<div class="item"><div class="ic" style="background:#f3ebe0">${BENF[b.tipo]?.i || '📌'}</div><div class="tx"><b>${esc(b.nome || BENF[b.tipo]?.n)}</b>
      <small>${BENF[b.tipo]?.n || ''}${b.metros ? ' · ' + fmtN(b.metros) + ' m' : ''}${N(b.fios) ? ` · ${b.fios} fios${b.arame ? ' ' + esc(b.arame) : ''} = ${fmtN(N(b.metros)*N(b.fios))} m de arame` : ''}${b.obs ? ' · ' + esc(b.obs) : ''}</small></div>
      <button class="lnk" data-bv="${b.id}">Ver</button><button class="x" data-bd="${b.id}">✕</button></div>`).join('');
}

      <input type="file" id="mp-file" accept=".zip,.kml,.geojson,.json" style="display:none">

function atualizarSelPastos(){

  if ([...sel.options].some(o => o.value === v)) sel.value = v;

function desenharCamadas(){
  if (!mapa) return;
  camadas.clearLayers();
  const lim = parseGeo(S.config.limite);
  if (lim) L.geoJSON(lim, {style:{color:'#ffd400', weight:3, fill:false, dashArray:'6 4'}, interactive:false}).addTo(camadas);
  const lot = Object.fromEntries(lotacao(saldos()).map(x => [x.p.id, x]));
  for (const p of S.pastos){
    const g = parseGeo(p.geo); if (!g) continue;
    const x = lot[p.id], cor = x && x.sem !== 'n' ? COR_SEM[x.sem] : '#ffffff';
    const info = x && x.lotes.length ? `${fmtN(x.cab)} cab · ${x.uaha != null ? fmtN(x.uaha,2) + ' UA/ha' : ''}` : 'vazio';
    L.geoJSON(g, {style:{color:cor, weight:2, fillColor:cor, fillOpacity:x?.lotes.length ? .35 : .12}})
      .bindTooltip(`${esc(p.nome)}<br>${fmtN(p.area,1)} ha · ${info}`, {permanent:true, direction:'center', className:'lbl'}).addTo(camadas);
  }
  for (const b of S.benf){
    const g = parseGeo(b.geo); if (!g) continue;
    if (g.type === 'Point') L.marker([g.coordinates[1], g.coordinates[0]], {icon:L.divIcon({className:'', html:`<div class="pin">${BENF[b.tipo]?.i || '📌'}</div>`, iconSize:[26,26], iconAnchor:[13,13]})})
      .bindTooltip(esc(b.nome || BENF[b.tipo]?.n), {direction:'top', offset:[0,-10]}).addTo(camadas);
    else L.geoJSON(g, {style:{color:'#f2a33a', weight:4}}).bindTooltip(`${esc(b.nome || 'Cerca')} · ${fmtN(b.metros)} m`).addTo(camadas);
  }
  if (desenho?.layer) camadas.addLayer(desenho.layer);
}
function enquadrar(){
  if (camadas.getLayers().length){ const b = camadas.getBounds(); if (b.isValid()){ mapa.fitBounds(b, {padding:[20,20], maxZoom:17}); return; } }
  mapa.setView(S.config.centro || FAZENDA_CENTRO, 15);
}
function ligarMapa(){
  if (!window.L) return;
  mapa = L.map('map', {zoomControl:true, attributionControl:true});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Imagens © Esri'}).addTo(mapa);
  camadas = L.featureGroup().addTo(mapa);
  atualizarSelPastos(); desenharCamadas(); enquadrar();
  setTimeout(() => mapa && mapa.invalidateSize(), 200);

  const BTN = ['#mp-draw','#mp-del','#bf-ponto','#bf-cerca','#mp-p','#mp-imp'];
  const msg = t => { const m = $('#mp-msg'); m.style.display = t ? '' : 'none'; m.textContent = t || ''; };
  const geoPts = (pts, fechar) => { const c = pts.map(p => [+p.lng.toFixed(7), +p.lat.toFixed(7)]); return fechar ? {type:'Polygon', coordinates:[[...c, c[0]]]} : {type:'LineString', coordinates:c}; };
  const atualiza = () => {
    if (!desenho?.layer) return;
    desenho.layer.setLatLngs(desenho.pts);
    const n = desenho.pts.length, min = desenho.kind === 'pasto' ? 3 : 2;
    const ok = $('#mp-ok'); ok.disabled = n < min;
    ok.textContent = n < min ? `Concluir (${n}/${min})` : desenho.kind === 'pasto' ? `Concluir · ${fmtN(areaHa(geoPts(desenho.pts, true)),1)} ha` : `Concluir · ${fmtN(compM(geoPts(desenho.pts).coordinates))} m`;
  };
  const iniciar = kind => {
    desenho = {kind, pts:[], layer: kind === 'pasto' ? L.polygon([], {color:'#ffffff', weight:3, dashArray:'4 4', fillOpacity:.2, interactive:false})
      : kind === 'cerca' ? L.polyline([], {color:'#ffffff', weight:3, dashArray:'4 4', interactive:false}) : null};
    if (desenho.layer) camadas.addLayer(desenho.layer);
    mapa.doubleClickZoom.disable();
    window.scrollTo({top:0, behavior:'smooth'});
    BTN.forEach(s => { const e = $(s); if (e) e.disabled = true; });
    $('#mp-bar').classList.toggle('on', kind !== 'ponto');
    if (kind === 'ponto'){ $('#mp-bar').classList.add('on'); $('#mp-undo').style.visibility = 'hidden'; $('#mp-ok').style.visibility = 'hidden'; }
    msg(kind === 'ponto' ? 'Toque no mapa onde fica o ponto.' : kind === 'cerca' ? 'Toque ao longo da cerca, ponto por ponto.' : 'Toque nos cantos do pasto, em volta.');
    atualiza();
  };
  const sair = () => {
    if (desenho?.layer) camadas.removeLayer(desenho.layer);
    desenho = null; mapa.doubleClickZoom.enable(); msg('');
    $('#mp-bar').classList.remove('on'); $('#mp-undo').style.visibility = ''; $('#mp-ok').style.visibility = '';
    BTN.forEach(s => { const e = $(s); if (e) e.disabled = false; });
    desenharCamadas();
  };
  const concluir = () => {
    const d = desenho; if (!d) return;
    if (d.kind === 'pasto'){
      if (d.pts.length < 3) return;
      const geo = geoPts(d.pts, true), area = +areaHa(geo).toFixed(2), alvo = $('#mp-p').value;
      sair();
      if (alvo === '__novo') modalForm('Nome do pasto', `<label class="f"><span>Nome</span><input type="text" name="nome" required></label><p class="hint">Área desenhada: ${fmtN(area,2)} ha</p>`, fd => {
        const nome = (fd.get('nome')||'').trim(); if (!nome) return false;
        Store.add('pastos', {nome, area, geo:JSON.stringify(geo), criadoEm:Date.now()}); toast(`Pasto ${nome}: ${fmtN(area,1)} ha`);
      });
      else { Store.update('pastos', alvo, {geo:JSON.stringify(geo), area}); toast(`Área atualizada: ${fmtN(area,1)} ha`); }
    } else if (d.kind === 'cerca'){
      if (d.pts.length < 2) return;
      const geo = geoPts(d.pts), metros = Math.round(compM(geo.coordinates));
      sair();
      modalForm(`Cerca · ${fmtN(metros)} m`, `<label class="f"><span>Nome</span><input type="text" name="nome" placeholder="ex.: Divisa norte"></label>
        <div class="row2"><label class="f"><span>Fios de arame <em>opcional</em></span><input type="number" inputmode="numeric" name="fios" placeholder="ex.: 4"></label>
        <label class="f"><span>Arame</span><select name="arame"><option value="">—</option><option>farpado</option><option>liso</option></select></label></div>
        <label class="f"><span>Observação</span><input type="text" name="obs" placeholder="ex.: precisa trocar mourões"></label>`, fd => {
        Store.add('benfeitorias', {tipo:'cerca', nome:(fd.get('nome')||'').trim() || 'Cerca', metros, fios:N(fd.get('fios'))||null, arame:fd.get('arame')||'', obs:(fd.get('obs')||'').trim(), geo:JSON.stringify(geo), criadoEm:Date.now()});

  };

  };

  mapa.on('locationerror', () => toast('Não foi possível pegar a localização. Libere o GPS no navegador.'));

  $('#mp-locb').onclick = () => {
    const t = $('#mp-loc').value;

    if (!m) return toast('Não reconheci as coordenadas. Ex.: -16.6799, -49.2550');
    const c = [N(m[1]), N(m[2])];
    if (Math.abs(c[0]) > 35 || Math.abs(c[1]) > 75) return toast('Coordenadas fora do Brasil?');
    Store.setConfig({centro:c}); mapa.setView(c, 15); toast('Localização salva');
  };
}
async function importarLimite(f){
  try {
    const nome = f.name.toLowerCase();
    let fcs = [];
    if (nome.endsWith('.zip')){
      if (!window.shp) return toast('Leitor de shapefile não carregou.');
      const r = await shp(await f.arrayBuffer()); fcs = Array.isArray(r) ? r : [r];
    } else if (nome.endsWith('.kml')){
      if (!window.toGeoJSON) return toast('Leitor de KML não carregou.');
      fcs = [toGeoJSON.kml(new DOMParser().parseFromString(await f.text(), 'text/xml'))];
    } else {
      const j = JSON.parse(await f.text()); fcs = [j.type === 'FeatureCollection' ? j : {type:'FeatureCollection', features:[j.type === 'Feature' ? j : {type:'Feature', geometry:j}]}];
    }
    /* no CAR, o perímetro do imóvel vem num shapefile com "AREA_IMOVEL" no nome */
    const escolhido = fcs.find(fc => /area_imovel|imovel/i.test(fc.fileName || '')) || fcs.find(fc => fc.features?.some(ft => /Polygon/.test(ft.geometry?.type))) || fcs[0];
    const polys = [];
    for (const ft of escolhido?.features || []){
      const g = ft.geometry; if (!g) continue;
      if (g.type === 'Polygon') polys.push(g.coordinates.map(r => r.map(c => c.slice(0,2))));
      if (g.type === 'MultiPolygon') g.coordinates.forEach(p => polys.push(p.map(r => r.map(c => c.slice(0,2)))));
    }
    if (!polys.length) return toast('Não achei nenhum polígono no arquivo.');
    const geo = polys.length === 1 ? {type:'Polygon', coordinates:polys[0]} : {type:'MultiPolygon', coordinates:polys};
    Store.setConfig({limite:JSON.stringify(geo), limiteNome:f.name});
    toast(`Limite importado: ${fmtN(areaHa(geo),1)} ha`);
    render();
  } catch(e){ toast('Não consegui ler o arquivo: ' + e.message); }
}

/* ---------- histórico ---------- */
function resumo(e){
  const cn = c => CATS_C[c] || c;
  switch (e.tipo){
    case 'parto': return `${N(e.machos)} ♂ · ${N(e.femeas)} ♀` + (N(e.mortos) ? ` · ${N(e.mortos)} natimorto(s)` : '') + (N(e.primiparas) ? ` · ${N(e.primiparas)} mãe(s) novilha` : '') + (e.brincos ? ` · brincos ${esc(e.brincos)}` : '');
    case 'morte': return `${fmtN(e.qtd)} ${cn(e.cat)} · ${esc(e.causa)}`;
    case 'desmama': return `${N(e.machos)+N(e.femeas)} bezerros (${N(e.machos)} ♂ ${N(e.femeas)} ♀)` + (e.peso ? ` · ${fmtN(e.peso)} kg` : '') + ` → ${e.loteDestino ? esc(nomeLote(e.loteDestino)) : 'vendidos'}` + (e.valor ? ` · ${fmtR(e.valor)}` : '');
    case 'toque': return `${fmtN(e.prenhes)} prenhas · ${fmtN(e.vazias)} vazias · ${fmtP(N(e.prenhes)/(N(e.prenhes)+N(e.vazias)))}`;
    case 'sanitario': return `${esc(protPor(e.protId)?.nome || e.protNome || 'protocolo')}` + (e.qtd ? ` · ${fmtN(e.qtd)} animais` : '') + (e.produto ? ` · ${esc(e.produto)}` : '');
    case 'entrada': return `+${fmtN(e.qtd)} ${cn(e.cat)} · ${esc(e.motivo)}`;
    case 'saida': return `−${fmtN(e.qtd)} ${cn(e.cat)} · ${esc(e.motivo)}` + (e.valor ? ` · ${fmtR(e.valor)} (${fmtR(e.valorCab)}/cab)` : '') + (e.peso ? ` · ${fmtN(e.peso)} kg` : '');
    case 'transferencia': return `${fmtN(e.qtd)} ${cn(e.cat)} → ${e.loteDestino ? esc(nomeLote(e.loteDestino)) : 'mesmo lote'}${e.catDestino && e.catDestino !== e.cat ? ' como ' + cn(e.catDestino) : ''}`;
    case 'contagem': return Object.entries(e.contagens || {}).map(([c,n]) => `${fmtN(n)} ${cn(c)}`).join(' · ');
    case 'gasto': return `${GASTOS[e.gcat]?.i||''} ${esc(GASTOS[e.gcat]?.n||e.gcat)} · <b style="display:inline">${fmtR(e.valor)}</b>` + (e.qtd ? ` · ${fmtN(e.qtd)} ${esc(e.unid)}` : '');
    case 'chuva': return `${fmtN(e.mm,1)} mm`;
    case 'tarefa': return `${esc(e.tarefaNome)} · ${e.problema ? '⚠️ problema' : 'feita'}`;
  }
  return '';
}

  const lista = ordenar(S.lanc).reverse().filter(e => (!F.lote || e.loteId === F.lote || e.loteDestino === F.lote) && (!F.tipo || e.tipo === F.tipo));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lanc), 'Lançamentos');

  if (S.benf.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.benf.map(b => { const g = parseGeo(b.geo); return {Tipo:BENF[b.tipo]?.n || b.tipo, Nome:b.nome || '', Metros:b.metros || '', Fios:b.fios || '', Arame:b.arame || '', 'Metros de arame':N(b.metros)*N(b.fios) || '', Latitude:g?.type === 'Point' ? g.coordinates[1] : '', Longitude:g?.type === 'Point' ? g.coordinates[0] : '', Obs:b.obs || ''}; })), 'Benfeitorias');
  XLSX.writeFile(wb, `manejo_cria_${hoje()}.xlsx`);
}

    modalForm('Editar pasto', `<label class="f"><span>Nome</span><input type="text" name="nome" value="${esc(p.nome)}"></label>
      <div class="row2"><label class="f"><span>Área (ha)</span><input type="number" inputmode="decimal" step="any" name="area" value="${esc(p.area ?? '')}"></label>
      <label class="f"><span>Capacidade (UA/ha)</span><input type="number" inputmode="decimal" step="any" name="cap" value="${esc(p.cap ?? '')}" placeholder="padrão"></label></div>
      <button type="button" class="btn del sm" id="pdel">Excluir pasto</button>`,
      fd => { const nome = (fd.get('nome')||'').trim(); if (!nome) return false; Store.update('pastos', p.id, {nome, area:N(fd.get('area'))||null, cap:N(fd.get('cap'))||null}); },
      'Salvar', fm => { fm.querySelector('#pdel').onclick = async () => {
        fm.closest('.modal').remove();
        if (S.lotes.some(l => l.pastoId === p.id && l.ativo !== false)) return toast('Tire os lotes deste pasto antes de excluir.');
        if (await confirmar(`Excluir o pasto ${p.nome}?`)) Store.remove('pastos', p.id);
      }; });
  });
  $('#ft').onsubmit = ev => { ev.preventDefault(); const fd = new FormData(ev.target), nome = (fd.get('nome')||'').trim(); if (!nome) return;
    Store.add('tarefas', {nome, freq:N(fd.get('freq')) || 1, ativo:true, criadoEm:Date.now()}); toast('Tarefa adicionada'); };
  $('#t-sug') && ($('#t-sug').onclick = () => { for (const x of TAREFAS_SUG) if (!S.tarefas.some(t => t.nome === x.nome)) Store.add('tarefas', {...x, ativo:true, criadoEm:Date.now()}); toast('Tarefas sugeridas adicionadas'); });
  document.querySelectorAll('[data-tf]').forEach(s => s.onchange = () => { Store.update('tarefas', s.dataset.tf, {freq:N(s.value)}); toast('Frequência atualizada'); });
  document.querySelectorAll('[data-td]').forEach(b => b.onclick = async () => { const t = S.tarefas.find(x => x.id === b.dataset.td); if (t && await confirmar(`Excluir a tarefa ${t.nome}? As baixas já feitas continuam no histórico.`)) Store.remove('tarefas', t.id); });
  $('#sair') && ($('#sair').onclick = () => Store.au.signOut(Store.auth));
  $('#zerar') && ($('#zerar').onclick = async () => {
    if (!await confirmar('Apagar todos os dados de teste deste aparelho?', 'Apagar')) return;
    ['pastos','lotes','lancamentos','protocolos','benfeitorias','tarefas','config'].forEach(c => { try { localStorage.removeItem('manejo_cria_' + c); } catch(e){} });
    location.reload();
  });
}

/* ---------- inicialização ---------- */
(async () => {
  render();
  if (MODO_TESTE){ Store = LocalStore(); assinar(); carregarClima(); setTimeout(checarPremios, 1500); return; }
  try {
    Store = await FireStore();
    Store.au.onAuthStateChanged(Store.auth, u => {
      S.user = u;
      if (u){ assinar(); carregarClima(); setTimeout(checarPremios, 2500); }
      else { Store.stop(); S.pronto = false; S.pastos = []; S.lotes = []; S.lanc = []; S.protocolos = []; S.benf = []; S.tarefas = []; S.config = {}; render(); }
    });
  } catch(e){
    $('#app').innerHTML = `<div class="login"><h1>Erro</h1><p class="muted">Não foi possível conectar ao Firebase. Verifique a internet e o firebaseConfig.</p><p class="warn">${esc(e.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
